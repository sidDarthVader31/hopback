name: Feature or new site
description: Suggest an improvement or ask for another chat site.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: site
    attributes:
      label: If this is a new site, its address
      placeholder: https://chat.example.com
